apiVersion: apps/v1
kind: Deployment
metadata: { name: desercion-api, labels: { app: desercion-api } }
spec:
  replicas: 3
  selector: { matchLabels: { app: desercion-api } }
  template:
    metadata: { labels: { app: desercion-api } }
    spec:
      containers:
        - name: api
          image: desercion-api:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - { name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000" }
            - { name: MODEL_NAME, value: "desercion_caso_x" }
            - { name: MODEL_ALIAS, value: "champion" }
            - name: POD_NAME           # downward API: cada réplica reporta su propio nombre
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "768Mi" }
          readinessProbe: { httpGet: { path: /ready, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 20, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: desercion-api }
spec:
  type: NodePort
  selector: { app: desercion-api }
  ports: [{ port: 8000, targetPort: 8000, nodePort: 30080 }]
